<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dialogue-summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1413; --panel:#111b19; --panel-2:#16221f; --line:#223029;
    --fg:#e9f1ee; --muted:#93a59f; --faint:#64756f;
    --accent:#3cc2ad; --accent-ink:#8fe6d7; --accent-deep:#0f6b5e;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(1000px 500px at 85% -10%, rgba(60,194,173,.10), transparent 60%),
      var(--bg);
    color:var(--fg);font-family:var(--sans);line-height:1.55;padding:0 16px}
  .wrap{max-width:720px;margin:0 auto;padding:36px 0 60px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:grid;place-items:center;font-weight:800;color:#05221d;font-size:19px;margin-bottom:16px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 4px}
  .sub a{color:var(--accent-ink);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  label{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);margin:26px 0 8px}
  textarea{width:100%;min-height:200px;resize:vertical;background:var(--panel);color:var(--fg);
    border:1px solid var(--line);border-radius:13px;padding:14px 16px;font-family:inherit;font-size:14.5px;
    line-height:1.5;outline:none;transition:border-color .15s}
  textarea:focus{border-color:var(--accent-deep)}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px}
  button{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#05221d;border:none;
    font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:12px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .ex{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500;padding:11px 16px}
  .ex:hover{color:var(--fg);border-color:var(--accent-deep);filter:none}
  .out{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:13px;padding:16px 18px;display:none}
  .out .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
  .out .v{font-size:15.5px}
  .dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);
    opacity:.5;animation:b 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.35}30%{opacity:1}}
  .foot{margin-top:28px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">s</div>
  <h1>dialogue-summarizer</h1>
  <p class="sub">A Qwen2.5-0.5B model fine-tuned with LoRA on SamSum &mdash; paste a chat, get a one-line summary.</p>
  <p class="sub"><a href="https://github.com/Azizjouili/dialogue-summarizer-lora" target="_blank" rel="noopener">GitHub</a> &middot; <a href="https://huggingface.co/azizjouili4/qwen2.5-0.5b-samsum-lora" target="_blank" rel="noopener">model on HF</a></p>

  <label for="box">Conversation</label>
  <textarea id="box" placeholder="Hannah: Hey, do you have Betty's number?&#10;Amanda: Lemme check&#10;Amanda: Sorry, can't find it. Ask Larry&#10;Hannah: I don't know him well&#10;Amanda: Don't be shy, he's very nice"></textarea>
  <div class="row">
    <button id="go">Summarize</button>
    <button class="ex" id="example">Load example</button>
  </div>

  <div class="out" id="out"><div class="k">Summary</div><div class="v" id="outv"></div></div>
  <p class="foot">Runs a 0.5B model on CPU &mdash; a summary takes a few seconds.</p>
</div>

<script>
const box=document.getElementById("box"),go=document.getElementById("go"),out=document.getElementById("out"),outv=document.getElementById("outv");
const EXAMPLE=`Hannah: Hey, do you have Betty's number?
Amanda: Lemme check
Amanda: Sorry, can't find it. Ask Larry
Amanda: He called her last time we were at the park together
Hannah: I don't know him well
Amanda: Don't be shy, he's very nice
Hannah: If you say so..`;
document.getElementById("example").onclick=()=>{box.value=EXAMPLE;};
go.onclick=async()=>{
  const d=box.value.trim(); if(!d) return;
  go.disabled=true; out.style.display="block"; outv.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  try{
    const r=await fetch("/summarize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dialogue:d})});
    const j=await r.json(); outv.textContent=j.summary||"(no summary)";
  }catch(e){ outv.textContent="Error: "+e.message; }
  finally{ go.disabled=false; }
};
</script>
</body>
</html>
