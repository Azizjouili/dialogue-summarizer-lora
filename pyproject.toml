[project]
name = "dialogue-summarizer-lora"
version = "0.1.0"
description = "LoRA-fine-tuned Qwen2.5-0.5B dialogue summarizer with a FastAPI service."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "ge78huc", email = "ge78huc@tum.de" }
]

dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]